<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 C · 书脊书架</title>
<meta name="dsh-design" content="web">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<style>
.stage{padding-top:34px}
.panel{padding:26px 26px 12px}
.spines{gap:0;align-items:flex-end;padding-bottom:14px}
.spine{position:relative;flex:0 0 auto;width:var(--w,44px);height:var(--ht,206px);margin-right:5px;padding:0;border:1px solid var(--cover-line);border-radius:8px 8px 4px 4px;background:var(--cover-bg);color:var(--cover-ink);box-shadow:var(--cover-shadow);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .18s cubic-bezier(.2,.8,.2,1),box-shadow .18s}
.spine:hover,.spine:focus-visible{transform:translateY(-7px)}
.spine:focus-visible{outline:2px solid var(--primary);outline-offset:3px}
.spine::before,.spine::after{content:'';position:absolute;left:0;right:0;height:1px;background:var(--line)}
.spine::before{top:6px}
.spine::after{bottom:6px;background:var(--line)}
.spine:nth-child(2n){--ht:196px}
.spine:nth-child(3n){--ht:214px}
.spine-title{writing-mode:vertical-rl;font-family:var(--serif);font-size:13px;line-height:1.6;letter-spacing:.2em;white-space:nowrap;overflow:hidden;max-height:88%;flex:0 0 auto;text-shadow:none}
.spine-title.latin{writing-mode:horizontal-tb;transform:rotate(90deg);font-family:Georgia,serif;font-size:12px;line-height:1;letter-spacing:.03em;white-space:nowrap}
.spine-peek{position:absolute;left:50%;bottom:calc(100% + 12px);transform:translate(-50%,6px);width:112px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:5}
.spine:hover .spine-peek,.spine:focus-visible .spine-peek{opacity:1;transform:translate(-50%,0)}
.spine-peek .cover{box-shadow:var(--cover-shadow-hover)}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">墨</span><div><strong>墨读</strong><small>读想读的书</small></div></div>
    <nav class="nav">
      <button class="on" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 15h16"/></svg>书架</button>
      <button type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/></svg>发现</button>
      <button type="button"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 8h6M9 12h6"/></svg>书源</button>
      <button type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>设置</button>
    </nav>
  </aside>

  <main class="main">
    <header class="head">
      <div><h1>我的书架</h1><p>8 本 · 本机保存</p></div>
      <div class="actions">
        <div class="toggle"><button class="on" type="button">书架</button><button type="button">列表</button></div>
        <button class="ghost" type="button"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>补查</button>
      </div>
    </header>

    <section class="stage">
      <div class="panel">
        <div class="shelf">
          <div class="shelf-row spines">
            <button class="spine" type="button" style="--h:130">
              <span class="spine-title">我可是正道大师兄</span>
              <span class="spine-peek"><span class="cover" style="--h:130"><span class="fallback"><span class="ft">我可是正道大师兄</span><span class="seal">我</span></span></span></span>
            </button>
            <button class="spine" type="button" style="--h:88;--w:40px">
              <span class="spine-title latin">mr-two-chapters</span>
              <span class="spine-peek"><span class="cover" style="--h:88"><span class="fallback"><span class="ft latin">mr-two-chapters</span><span class="seal">两</span></span></span></span>
            </button>
            <button class="spine" type="button" style="--h:285;--w:46px">
              <span class="spine-title latin">curl-test</span>
              <span class="spine-peek"><span class="cover" style="--h:285"><span class="fallback"><span class="ft latin">curl-test</span><span class="seal">卷</span></span></span></span>
            </button>
            <button class="spine" type="button" style="--h:210">
              <span class="spine-title">月亮与六便士</span>
              <span class="spine-peek"><span class="cover art"><span class="art-title">月亮与六便士</span></span></span>
            </button>
            <button class="spine" type="button" style="--h:28">
              <span class="spine-title">人类简史</span>
              <span class="spine-peek"><span class="cover art"><span class="art-title">人类简史</span></span></span>
            </button>
            <button class="spine" type="button" style="--h:10">
              <span class="spine-title">百年孤独</span>
              <span class="spine-peek"><span class="cover" style="--h:10"><span class="fallback"><span class="ft">百年孤独</span><span class="seal">孤</span></span></span></span>
            </button>
            <button class="spine" type="button" style="--h:200">
              <span class="spine-title">局外人</span>
              <span class="spine-peek"><span class="cover" style="--h:200"><span class="fallback"><span class="ft">局外人</span><span class="seal">局</span></span></span></span>
            </button>
            <button class="spine" type="button" style="--h:45;--w:42px">
              <span class="spine-title latin">The Little Prince</span>
              <span class="spine-peek"><span class="cover art"><span class="art-title">The Little Prince</span></span></span>
            </button>
          </div>
          <span class="plank"></span>
        </div>
        <div class="hint">点书脊翻开，悬停看封面</div>
      </div>
    </section>
  </main>
</div>
</body>
</html>

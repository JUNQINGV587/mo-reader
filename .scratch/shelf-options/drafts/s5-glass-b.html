<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 E · 夜间玻璃（B）</title>
<meta name="dsh-design" content="web">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<style>
:root{--bg:#101218;--paper:#101218;--card:rgba(255,255,255,.07);--panel:rgba(255,255,255,.05);--panel-2:rgba(255,255,255,.03);--ink:#F2F4FA;--ink-2:#A7AEC4;--muted:#A7AEC4;--line:rgba(255,255,255,.13);--primary:#8E9BFF;--primary-hover:#7C89F5;--primary-ink:#10121A;--accent:#FFB38A;--link:#A9B4FF;--seal:#FFB38A;--seal-ink:#10121A;--radius:24px;--raise:0 20px 50px rgba(0,0,0,.35);--press:inset 0 2px 8px rgba(0,0,0,.4);--cover-bg:rgba(255,255,255,.06);--cover-ink:#F2F4FA;--cover-line:rgba(255,255,255,.14);--cover-wash:rgba(255,179,138,.14);--cover-shine:rgba(255,255,255,.10);--cover-spine:rgba(0,0,0,.35);--cover-edge:rgba(255,255,255,.16);--cover-text-shadow:none;--cover-shadow:0 14px 34px rgba(0,0,0,.35);--cover-shadow-hover:0 20px 44px rgba(0,0,0,.45);--book-page:rgba(255,255,255,.06);--book-page-2:rgba(255,255,255,.03);--progress-track:rgba(255,255,255,.14);--plank:rgba(255,255,255,.04);--plank-2:rgba(255,255,255,.07);--badge-bg:#FFB38A;--badge-ink:#10121A}
body{background:radial-gradient(1200px 800px at 15% 10%,#1B1530 0%,transparent 60%),radial-gradient(1000px 700px at 90% 0%,#0E1A18 0%,transparent 55%),#0F1118;background-attachment:fixed}
.head::after{display:none}
.side{background:transparent}
.panel,.hero{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.stage{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:28px;align-items:start;padding-top:26px}
.hero{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px;padding:22px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--raise)}
.hero .cover{width:100%;border-radius:14px;box-shadow:var(--cover-shadow)}
.hero .eyebrow{margin:0;font-size:12px;letter-spacing:.14em;color:var(--link);font-weight:600}
.hero h2{margin:0;font-family:var(--title);font-weight:800;font-size:26px;line-height:1.35;letter-spacing:.02em}
.hero .by{margin:0;color:var(--muted);font-size:12px}
.hero .progress{height:4px;border-radius:2px;background:var(--progress-track);overflow:hidden}
.hero .progress i{display:block;width:42%;height:100%;background:var(--primary)}
.hero .cta{padding:11px 22px;border:0;border-radius:14px;background:var(--primary);color:var(--primary-ink);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.06em}
.hero .cta:hover{background:var(--primary-hover)}
.library h2{font-family:var(--title);font-weight:800;font-size:14px;margin:0 0 18px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.04em}
.library h2 span{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:50%;background:var(--badge-bg);color:var(--badge-ink);font-size:12px;font-weight:700}
.library .grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.library .book .cover{width:100%}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">墨</span><div><strong>墨读</strong><small>读想读的书</small></div></div>
    <nav class="nav">
      <button class="on" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 15h16"/></svg>书架</button>
      <button type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/></svg>发现</button>
      <button type="button"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 8h6M9 12h6"/></svg>书源</button>
      <button type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>设置</button>
    </nav>
  </aside>

  <main class="main">
    <header class="head">
      <div><h1>我的书架</h1><p>8 本 · 本机保存</p></div>
      <div class="actions">
        <div class="toggle"><button class="on" type="button">书架</button><button type="button">列表</button></div>
        <button class="ghost" type="button"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>补查</button>
      </div>
    </header>

    <section class="stage">
      <div class="hero">
        <span class="cover" style="--h:130"><span class="fallback"><span class="ft">我可是正道大师兄</span><span class="seal">我</span></span><span class="spine-edge"></span><span class="pages"></span></span>
        <p class="eyebrow">继续阅读</p>
        <h2>我可是正道大师兄</h2>
        <p class="by">本地 TXT · 第 12 / 28 章 · 已读 42%</p>
        <div class="progress"><i></i></div>
        <button class="cta" type="button">继续阅读</button>
      </div>

      <div class="library">
        <h2>全部书籍 <span>8 本</span></h2>
        <div class="grid">
          <button class="book" type="button">
            <span class="cover" style="--h:130"><span class="fallback"><span class="ft">我可是正道大师兄</span><span class="seal">我</span></span><span class="spine-edge"></span><span class="pages"></span></span>
            <span class="meta"><strong>我可是正道大师兄</strong><small>本地 TXT</small></span>
          </button>
          <button class="book" type="button">
            <span class="cover" style="--h:88"><span class="fallback"><span class="ft latin">mr-two-chapters</span><span class="seal">两</span></span><span class="spine-edge"></span><span class="pages"></span></span>
            <span class="meta"><strong>mr-two-chapters</strong><small>本地 TXT</small></span>
          </button>
          <button class="book" type="button">
            <span class="cover" style="--h:285"><span class="fallback"><span class="ft latin">curl-test</span><span class="seal">卷</span></span><span class="spine-edge"></span><span class="pages"></span></span>
            <span class="meta"><strong>curl-test</strong><small>本地 TXT</small></span>
          </button>
          <button class="book" type="button">
            <span class="cover art"><span class="art-title">月亮与六便士</span><span class="spine-edge"></span><span class="pages"></span></span>
            <span class="meta"><strong>月亮与六便士</strong><small>毛姆 · EPUB</small></span>
          </button>
          <button class="book" type="button">
            <span class="cover art"><span class="art-title">人类简史</span><span class="spine-edge"></span><span class="pages"></span></span>
            <span class="meta"><strong>人类简史</strong><small>尤瓦尔·赫拉利 · EPUB</small></span>
          </button>
          <button class="book" type="button">
            <span class="cover" style="--h:10"><span class="fallback"><span class="ft">百年孤独</span><span class="seal">孤</span></span><span class="spine-edge"></span><span class="pages"></span></span>
            <span class="meta"><strong>百年孤独</strong><small>加西亚·马尔克斯 · EPUB</small></span>
          </button>
          <button class="book" type="button">
            <span class="cover" style="--h:200"><span class="fallback"><span class="ft">局外人</span><span class="seal">局</span></span><span class="spine-edge"></span><span class="pages"></span></span>
            <span class="meta"><strong>局外人</strong><small>加缪 · 本地 TXT</small></span>
          </button>
          <button class="book" type="button">
            <span class="cover art"><span class="art-title">The Little Prince</span><span class="spine-edge"></span><span class="pages"></span></span>
            <span class="meta"><strong>The Little Prince</strong><small>Saint-Exupéry · EPUB</small></span>
          </button>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>

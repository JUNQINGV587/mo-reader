<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方案 E · 极光列表（C）</title>
<meta name="dsh-design" content="web">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="shell.css">
<style>
:root{--bg:#F4F8F2;--paper:#F4F8F2;--card:rgba(255,255,255,.70);--panel:rgba(255,255,255,.60);--panel-2:rgba(255,255,255,.40);--ink:#25312A;--ink-2:#6B7A70;--muted:#6B7A70;--line:rgba(255,255,255,.85);--primary:#25735E;--primary-hover:#1F6450;--primary-ink:#FFFFFF;--accent:#F2A65A;--link:#25735E;--seal:#F2A65A;--seal-ink:#25312A;--radius:20px;--raise:0 18px 40px rgba(30,80,55,.12);--press:inset 0 2px 8px rgba(30,80,55,.14);--cover-bg:rgba(255,255,255,.60);--cover-ink:#25312A;--cover-line:rgba(255,255,255,.90);--cover-wash:rgba(242,166,90,.18);--cover-shine:rgba(255,255,255,.45);--cover-spine:rgba(37,49,42,.08);--cover-edge:rgba(255,255,255,.80);--cover-text-shadow:none;--cover-shadow:0 10px 26px rgba(30,80,55,.10);--cover-shadow-hover:0 16px 36px rgba(30,80,55,.16);--book-page:rgba(255,255,255,.60);--book-page-2:rgba(255,255,255,.35);--progress-track:rgba(255,255,255,.80);--plank:rgba(255,255,255,.45);--plank-2:rgba(255,255,255,.70);--badge-bg:#F2A65A;--badge-ink:#25312A}
body{background:linear-gradient(140deg,#F2F7F1 0%,#FFF6EC 55%,#EEF7F3 100%);background-attachment:fixed}
.head::after{display:none}
.side{background:transparent}
.panel,.hero{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.hero{display:grid;grid-template-columns:180px 1fr;gap:26px;align-items:center;padding:22px 26px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);box-shadow:var(--raise);margin-bottom:30px}
.hero .cover{width:180px;border-radius:12px;box-shadow:var(--cover-shadow)}
.hero .eyebrow{margin:0 0 6px;font-size:12px;letter-spacing:.14em;color:var(--link);font-weight:600}
.hero h2{margin:0;font-family:var(--title);font-weight:800;font-size:24px;line-height:1.35;letter-spacing:.02em}
.hero .by{margin:5px 0 12px;color:var(--muted);font-size:12px}
.hero .progress{height:4px;border-radius:2px;background:var(--progress-track);overflow:hidden;margin-bottom:12px;max-width:420px}
.hero .progress i{display:block;width:42%;height:100%;background:var(--primary)}
.hero .cta{padding:10px 22px;border:0;border-radius:12px;background:var(--primary);color:var(--primary-ink);font-size:14px;font-weight:600;cursor:pointer;letter-spacing:.06em}
.hero .cta:hover{background:var(--primary-hover)}
.library h2{font-family:var(--title);font-weight:800;font-size:14px;margin:0 0 18px;display:flex;justify-content:space-between;align-items:baseline;letter-spacing:.04em}
.library h2 span{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:50%;background:var(--badge-bg);color:var(--badge-ink);font-size:12px;font-weight:700}
.library .rows{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:14px;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--card);box-shadow:var(--raise);text-align:left;cursor:pointer;color:var(--ink);font-family:inherit}
.row .cover{width:44px;border-radius:5px;box-shadow:var(--cover-shadow)}
.row .cover .ft,.row .cover .seal,.row .cover .art-title{display:none}
.row .meta{display:flex;flex-direction:column;gap:3px;min-width:0}
.row .meta strong{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">墨</span><div><strong>墨读</strong><small>读想读的书</small></div></div>
    <nav class="nav">
      <button class="on" type="button"><svg viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 15h16"/></svg>书架</button>
      <button type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="m15 9-2 4-4 2 2-4z"/></svg>发现</button>
      <button type="button"><svg viewBox="0 0 24 24"><path d="M5 4h11l3 3v13H5z"/><path d="M9 8h6M9 12h6"/></svg>书源</button>
      <button type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v2m0 14v2M3 12h2m14 0h2M5.6 5.6l1.4 1.4m10 10 1.4 1.4m0-12.8-1.4 1.4m-10 10-1.4 1.4"/></svg>设置</button>
    </nav>
  </aside>

  <main class="main">
    <header class="head">
      <div><h1>我的书架</h1><p>8 本 · 本机保存</p></div>
      <div class="actions">
        <div class="toggle"><button class="on" type="button">书架</button><button type="button">列表</button></div>
        <button class="ghost" type="button"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>补查</button>
      </div>
    </header>

    <section class="stage">
      <div class="hero">
        <span class="cover" style="--h:130"><span class="fallback"><span class="ft">我可是正道大师兄</span><span class="seal">我</span></span><span class="spine-edge"></span><span class="pages"></span></span>
        <div>
          <p class="eyebrow">继续阅读</p>
          <h2>我可是正道大师兄</h2>
          <p class="by">本地 TXT · 第 12 / 28 章 · 已读 42%</p>
          <div class="progress"><i></i></div>
          <button class="cta" type="button">继续阅读</button>
        </div>
      </div>

      <div class="library">
        <h2>全部书籍 <span>8 本</span></h2>
        <div class="rows">
          <button class="row" type="button">
            <span class="cover" style="--h:130"><span class="fallback"><span class="ft">我可是正道大师兄</span><span class="seal">我</span></span></span>
            <span class="meta"><strong>我可是正道大师兄</strong><small>本地 TXT</small></span>
            <span class="pct">42%</span>
          </button>
          <button class="row" type="button">
            <span class="cover" style="--h:88"><span class="fallback"><span class="ft latin">mr-two-chapters</span><span class="seal">两</span></span></span>
            <span class="meta"><strong>mr-two-chapters</strong><small>本地 TXT</small></span>
            <span class="pct">—</span>
          </button>
          <button class="row" type="button">
            <span class="cover" style="--h:285"><span class="fallback"><span class="ft latin">curl-test</span><span class="seal">卷</span></span></span>
            <span class="meta"><strong>curl-test</strong><small>本地 TXT</small></span>
            <span class="pct">—</span>
          </button>
          <button class="row" type="button">
            <span class="cover art"><span class="art-title">月亮与六便士</span></span>
            <span class="meta"><strong>月亮与六便士</strong><small>毛姆 · EPUB</small></span>
            <span class="pct">—</span>
          </button>
          <button class="row" type="button">
            <span class="cover art"><span class="art-title">人类简史</span></span>
            <span class="meta"><strong>人类简史</strong><small>尤瓦尔·赫拉利 · EPUB</small></span>
            <span class="pct">—</span>
          </button>
          <button class="row" type="button">
            <span class="cover" style="--h:10"><span class="fallback"><span class="ft">百年孤独</span><span class="seal">孤</span></span></span>
            <span class="meta"><strong>百年孤独</strong><small>加西亚·马尔克斯 · EPUB</small></span>
            <span class="pct">—</span>
          </button>
          <button class="row" type="button">
            <span class="cover" style="--h:200"><span class="fallback"><span class="ft">局外人</span><span class="seal">局</span></span></span>
            <span class="meta"><strong>局外人</strong><small>加缪 · 本地 TXT</small></span>
            <span class="pct">—</span>
          </button>
          <button class="row" type="button">
            <span class="cover art"><span class="art-title">The Little Prince</span></span>
            <span class="meta"><strong>The Little Prince</strong><small>Saint-Exupéry · EPUB</small></span>
            <span class="pct">—</span>
          </button>
        </div>
      </div>
    </section>
  </main>
</div>
</body>
</html>

<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsh-design" content="desktop">
<title>方向 A · 书脊墙 · 墨读</title>
<style>
  :root{
    --paper:#F2E9DA;
    --paper-deep:#E8DCC8;
    --card:#F8F1E4;
    --ink:#241C15;
    --ink-2:#4A3B2C;
    --muted:#6B5A47;
    --line:rgba(36,28,21,.16);
    --line-2:rgba(36,28,21,.3);
    --red:#A63A1F;
    --red-deep:#862C15;
    --brass:#A9854A;
    --side:#211A13;
    --side-2:#2C231A;
    --cream:#EFE3CC;
    --cream-2:#B7A488;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",serif;
    --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei",system-ui,sans-serif;
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font:13px/1.6 var(--sans);
    -webkit-font-smoothing:antialiased;
  }
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      radial-gradient(120% 80% at 70% 0%,rgba(255,251,242,.55),transparent 60%),
      radial-gradient(90% 70% at 100% 100%,rgba(120,90,50,.08),transparent 60%),
      repeating-linear-gradient(0deg,transparent 0 3px,rgba(36,28,21,.012) 3px 4px);
  }
  button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
  a{color:inherit;text-decoration:none}
  svg{display:block}
  .app{position:relative;z-index:1;height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr);overflow:hidden}

  /* ---- sidebar ---- */
  .side{
    background:linear-gradient(180deg,var(--side),#1A140E);
    color:var(--cream);
    padding:52px 14px 18px;
    display:flex;flex-direction:column;
    border-right:1px solid rgba(0,0,0,.35);
    min-height:0;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:0 8px}
  .brand-seal{
    width:26px;height:26px;flex:none;display:grid;place-items:center;
    border:1px solid var(--red);color:#F3DFC8;
    background:var(--red);font:15px/1 var(--serif);
    box-shadow:inset 0 0 0 2px rgba(33,26,19,.35);
  }
  .brand-name{font:21px/1.35 var(--serif);letter-spacing:.1em;width:64px;flex:none;padding:2px 0 3px}
  .brand-sub{margin:9px 0 0 44px;font:11px/1 var(--sans);letter-spacing:.2em;color:var(--cream-2)}
  .nav{margin-top:34px;display:flex;flex-direction:column;gap:2px}
  .nav-item{
    display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;
    color:var(--cream-2);font-size:13px;letter-spacing:.02em;
    border-left:2px solid transparent;position:relative;
    transition:background .18s var(--ease),color .18s var(--ease);
  }
  .nav-item svg{width:17px;height:17px;opacity:.85}
  .nav-item:hover{background:rgba(239,227,204,.06);color:var(--cream)}
  .nav-item.on{background:rgba(239,227,204,.09);color:#FBF2E1;border-left-color:var(--red)}
  .nav-item.on svg{opacity:1}
  .nav-kbd{margin-left:auto;font-size:11px;color:rgba(183,164,136,.7);letter-spacing:.04em}
  .side-spacer{flex:1}
  .week{padding:14px 10px 0;border-top:1px solid rgba(239,227,204,.12);margin-top:18px}
  .week-top{display:flex;justify-content:space-between;align-items:baseline}
  .week-label{font-size:11px;letter-spacing:.16em;color:var(--cream-2)}
  .week-value{font:15px/1.2 var(--serif);color:#F6ECD8}
  .week-dots{display:flex;gap:6px;margin-top:11px}
  .week-dots i{width:100%;height:3px;background:rgba(239,227,204,.15);display:block}
  .week-dots i.f{background:var(--brass)}
  .week-note{margin:10px 0 0;font-size:11px;color:rgba(183,164,136,.78);line-height:1.5}

  /* ---- main ---- */
  .main{min-width:0;display:flex;flex-direction:column;height:100vh;min-height:0}
  .topbar{
    height:52px;flex:none;display:flex;align-items:center;gap:16px;
    padding:0 40px;border-bottom:1px solid var(--line);
  }
  .search{
    display:flex;align-items:center;gap:8px;width:258px;height:30px;
    padding:0 9px;border:1px solid var(--line);background:rgba(255,252,245,.5);
    color:var(--muted);
  }
  .search svg{width:14px;height:14px}
  .search span{font-size:12px}
  .search .kbd{margin-left:auto;font-size:11px;letter-spacing:.04em;border:1px solid var(--line);padding:1px 5px;color:var(--muted)}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:18px}
  .status{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
  .status i{width:5px;height:5px;border-radius:50%;background:#5F7A58;display:block}
  .top-date{font-size:11px;letter-spacing:.08em;color:var(--muted)}
  .content{flex:1;overflow-y:auto;overflow-x:hidden;padding:26px 40px 22px;min-height:0}
  .content::-webkit-scrollbar{width:10px}
  .content::-webkit-scrollbar-thumb{background:rgba(36,28,21,.18);border:3px solid var(--paper)}

  .page-head{display:flex;align-items:flex-end;gap:24px}
  .kicker{margin:0 0 8px;font:11px/1 var(--sans);letter-spacing:.2em;color:var(--muted)}
  h1{margin:0;font:400 36px/1.1 var(--serif);letter-spacing:.02em}
  .lede{margin:8px 0 0;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .head-actions{margin-left:auto;display:flex;align-items:center;gap:18px;padding-bottom:3px}
  .toggle{display:flex;align-items:center;gap:0;border:1px solid var(--line-2)}
  .toggle button{
    padding:6px 13px;font-size:12px;color:var(--muted);
    transition:background .16s var(--ease),color .16s var(--ease);
  }
  .toggle button+button{border-left:1px solid var(--line)}
  .toggle button.on{background:var(--ink);color:var(--paper)}
  .toggle button:not(.on):hover{background:rgba(36,28,21,.05);color:var(--ink)}
  .ghost{display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-2);padding:6px 2px;border-bottom:1px solid transparent}
  .ghost svg{width:14px;height:14px}
  .ghost:hover{border-bottom-color:var(--line-2);color:var(--ink)}

  /* ---- shelves ---- */
  .shelf-section{margin-top:24px}
  .shelf-label{display:flex;align-items:center;gap:14px;margin-bottom:12px}
  .shelf-label p{margin:0;font:11px/1 var(--sans);letter-spacing:.18em;color:var(--muted);white-space:nowrap}
  .shelf-label::after{content:"";flex:1;height:1px;background:var(--line)}
  .shelf-label em{font-style:normal;font-size:11px;color:var(--muted);letter-spacing:.06em;white-space:nowrap}
  .shelf{overflow:visible}
  .shelf-inner{width:max-content;max-width:100%}
  .books{display:flex;align-items:flex-end;gap:12px;height:216px;padding:0 8px}
  .plank{
    height:10px;border-radius:1px;
    background:linear-gradient(180deg,#5A4430 0%,#3A2B1E 38%,#241A12 100%);
    box-shadow:0 12px 20px -12px rgba(36,28,21,.6),inset 0 1px 0 rgba(255,246,226,.18);width:100%;
    position:relative;
  }
  .plank::after{
    content:"";position:absolute;left:0;right:0;top:10px;height:1px;
    background:rgba(36,28,21,.22);
  }

  /* face-out current book */
  .now{display:flex;align-items:flex-end;padding-right:26px;flex:none}
  .faceout{display:block;transform:rotate(-1deg);transform-origin:50% 100%;transition:transform .22s var(--ease)}
  .faceout:hover{transform:rotate(-1deg) translateY(-7px)}
  .faceout:focus-visible{outline:2px solid var(--red);outline-offset:5px}
  .cover{
    width:152px;height:204px;position:relative;display:block;overflow:hidden;
    background:#E7D8BE;color:var(--ink);
    box-shadow:
      2px 2px 0 #D5C2A1,
      1px 0 0 #CBB794 inset,
      9px 12px 22px -10px rgba(36,28,21,.5);
  }
  .cover::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(105deg,rgba(255,255,255,.18),transparent 38%);
  }
  .cv-rule{position:absolute;inset:10px;border:1px solid rgba(36,28,21,.28)}
  .cv-seal{
    position:absolute;left:20px;top:20px;width:31px;height:31px;
    display:grid;place-items:center;background:var(--red);color:#F6E9D2;
    font:15px/1 var(--serif);
  }
  .cv-title{
    position:absolute;left:20px;top:61px;
    font:23px/1.32 var(--serif);letter-spacing:.03em;
  }
  .cv-title span{display:block}
  .cv-art{position:absolute;left:0;right:0;bottom:0;width:100%;height:72px}
  .cv-author{position:absolute;left:20px;bottom:12px;font:11px/1 var(--sans);letter-spacing:.1em;color:rgba(248,238,219,.92);z-index:2}
  .now-card{
    width:196px;margin-left:14px;margin-bottom:0;position:relative;z-index:2;
    background:var(--card);border:1px solid var(--line);
    box-shadow:0 8px 18px -14px rgba(36,28,21,.55);
    padding:13px 14px 12px;
  }
  .now-eyebrow{margin:0;display:flex;align-items:center;gap:6px;font:11px/1 var(--sans);letter-spacing:.14em;color:var(--red)}
  .now-eyebrow i{width:5px;height:5px;border-radius:50%;background:var(--red)}
  .now-meta{margin:9px 0 0;font:12px/1.5 var(--sans);color:var(--muted)}
  .now-bar{height:3px;background:rgba(36,28,21,.12);margin-top:9px;position:relative}
  .now-bar span{position:absolute;left:0;top:0;bottom:0;background:var(--red)}
  .now-cta{
    margin-top:10px;display:inline-flex;align-items:center;gap:7px;min-height:24px;
    font:13px/1 var(--sans);color:var(--ink);border-bottom:1px solid var(--line-2);padding:4px 0 5px;
  }
  .now-cta svg{width:13px;height:13px;transition:transform .18s var(--ease)}
  .now-cta:hover svg{transform:translateX(3px)}

  /* spines */
  .spine{
    position:relative;flex:none;display:flex;flex-direction:column;align-items:center;
    width:var(--w,42px);height:var(--h,218px);
    background:var(--c);
    color:var(--t);
    box-shadow:
      inset 1px 0 0 rgba(255,255,255,.18),
      inset -1px 0 0 rgba(0,0,0,.28),
      2px 3px 0 rgba(36,28,21,.13);
    padding:12px 0 11px;
    transition:transform .2s var(--ease),filter .2s var(--ease);
  }
  .spine:hover,.spine:focus-visible{transform:translateY(-8px);filter:brightness(1.05)}
  .spine:focus-visible{outline:2px solid var(--red);outline-offset:3px}
  .spine-seal{
    width:17px;height:17px;display:grid;place-items:center;flex:none;
    border:1px solid currentColor;font:11px/1 var(--serif);opacity:.95;
  }
  .spine-title{
    writing-mode:vertical-rl;text-orientation:upright;
    margin-top:10px;flex:1;min-height:0;font:15px/1.5 var(--serif);letter-spacing:.14em;
    overflow:hidden;
  }
  .spine-title.latin{text-orientation:mixed;white-space:nowrap;font-family:var(--sans);letter-spacing:.03em;font-size:11px;font-weight:500}
  .spine-author{
    margin-top:8px;flex:none;writing-mode:vertical-rl;text-orientation:upright;
    font:11px/1 var(--sans);letter-spacing:.04em;opacity:.95;max-height:72px;overflow:hidden;
  }
  .spine-author.lat{text-orientation:mixed}
  .ribbon{
    position:absolute;top:-13px;left:50%;transform:translateX(-50%);
    width:7px;height:29px;background:var(--red);
    clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);
  }
  .spine .peek{
    position:absolute;left:calc(100% + 12px);bottom:2px;
    width:126px;height:178px;z-index:6;
    background:var(--c);color:var(--t);
    padding:12px 11px 10px;display:flex;flex-direction:column;
    box-shadow:0 16px 30px -16px rgba(20,14,9,.7),2px 2px 0 rgba(36,28,21,.15);
    opacity:0;transform:translateX(-7px);pointer-events:none;
    transition:opacity .18s var(--ease),transform .22s var(--ease);
  }
  .spine:hover .peek,.spine:focus-visible .peek{opacity:1;transform:translateX(0)}
  .peek-rule{position:absolute;inset:7px;border:1px solid rgba(255,255,255,.22);pointer-events:none}
  .peek-seal{width:21px;height:21px;display:grid;place-items:center;border:1px solid currentColor;font:11px/1 var(--serif)}
  .peek-title{margin-top:auto;font:17px/1.3 var(--serif);letter-spacing:.06em;max-height:76px;overflow:hidden}
  .peek-title.lat{font-family:var(--sans);font-size:13px;font-weight:600;line-height:1.35}
  .peek-auth{margin-top:7px;font:11px/1.4 var(--sans);letter-spacing:.06em;opacity:.85}
  .peek-moon{position:absolute;right:14px;top:38px;width:26px;height:26px;border-radius:50%;border:1px solid currentColor;opacity:.5}

  .bookend{
    flex:none;width:22px;height:84px;margin-left:4px;
    background:linear-gradient(100deg,#B4945B,#87683A 58%,#513F22);
    clip-path:polygon(0 0,16% 0,100% 100%,0 100%);
    opacity:.9;
  }
  .footline{
    display:flex;justify-content:space-between;gap:20px;
    margin-top:22px;padding-top:11px;border-top:1px solid var(--line);
    font-size:11px;letter-spacing:.05em;color:var(--muted);
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }

  /* ---- phone ---- */
  @media (max-width:820px){
    .app{grid-template-columns:1fr;grid-template-rows:auto minmax(0,1fr)}
    .side{
      flex-direction:row;align-items:center;padding:12px 14px 10px;
      border-right:0;border-bottom:1px solid rgba(0,0,0,.35);gap:14px;
    }
    .brand{padding:0;gap:8px}
    .brand-seal{width:23px;height:23px;font:13px/1 var(--serif)}
    .brand-name{font-size:18px}
    .brand-sub,.side-spacer,.week{display:none}
    .nav{margin:0 0 0 auto;flex-direction:row;gap:2px}
    .nav-item{height:34px;padding:0 8px;border-left:0;border-bottom:2px solid transparent;gap:6px;font-size:11px}
    .nav-item.on{border-left:0;border-bottom-color:var(--red)}
    .nav-kbd{display:none}
    .nav-item svg{width:15px;height:15px}
    .topbar{display:none}
    .content{padding:22px 16px 30px}
    h1{font-size:32px}
    .page-head{flex-wrap:wrap;gap:16px}
    .head-actions{margin-left:0;width:100%;justify-content:space-between;padding:0}
    .shelf-section{margin-top:28px}
    .shelf{overflow-x:auto;overflow-y:hidden;padding-bottom:8px;margin:0 -16px;padding-left:16px;padding-right:16px}
    .shelf-inner{min-width:max-content}
    .books{height:196px;gap:9px;padding:0 4px}
    .cover{width:116px;height:156px}
    .cv-rule{inset:8px}
    .cv-seal{left:15px;top:15px;width:25px;height:25px;font:14px/1 var(--serif)}
    .cv-title{left:15px;top:45px;font:18px/1.3 var(--serif)}
    .cv-art{height:56px}
    .cv-author{left:15px;bottom:12px;font-size:8px}
    .now-card{width:166px;padding:11px 12px;margin-left:10px}
    .now-cta{font-size:12px}
    .spine{height:calc(var(--h,204px) * .8)}
    .spine-title{font-size:13px;max-height:none}
    .spine-author{font-size:8px}
    .spine .peek{display:none}
    .plank{box-shadow:0 10px 16px -12px rgba(36,28,21,.6),inset 0 1px 0 rgba(255,246,226,.18)}
    .footline{flex-direction:column;gap:4px;margin-top:26px}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="主导航">
    <div class="brand">
      <span class="brand-seal" aria-hidden="true">墨</span>
      <span class="brand-name">墨读</span>
    </div>
    <div class="brand-sub" aria-hidden="true">MO READ</div>
    <nav class="nav">
      <a class="nav-item on" href="#" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h5v15H5zM12 4h5v15h-5zM3 21h18"/></svg>
        书架
        <span class="nav-kbd">⌘1</span>
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M15.5 8.5l-2 5-5 2 2-5z"/></svg>
        发现
        <span class="nav-kbd">⌘2</span>
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 13a5 5 0 0 0 7 0l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-2 2a5 5 0 0 0 7 7l1-1"/></svg>
        书源
        <span class="nav-kbd">⌘3</span>
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>
        设置
        <span class="nav-kbd">⌘4</span>
      </a>
    </nav>
    <div class="side-spacer"></div>
    <div class="week">
      <div class="week-top">
        <span class="week-label">本周</span>
        <span class="week-value">3 时 42 分</span>
      </div>
      <div class="week-dots" aria-hidden="true"><i class="f"></i><i class="f"></i><i class="f"></i><i class="f"></i><i></i><i></i><i></i></div>
      <p class="week-note">昨天读得最久 ·《月亮与六便士》</p>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/></svg>
        <span>搜书名、作者</span>
        <span class="kbd">⌘K</span>
      </div>
      <div class="topbar-right">
        <span class="status"><i></i>离线可用</span>
        <span class="top-date">十一月六日 · 周五</span>
      </div>
    </div>

    <div class="content">
      <header class="page-head">
        <div>
          <p class="kicker">本机书库</p>
          <h1>书架</h1>
          <p class="lede">八本书，按最近翻阅立在架上。</p>
        </div>
        <div class="head-actions">
          <div class="toggle" role="group" aria-label="书架视图">
            <button type="button" class="on" aria-pressed="true">书架</button>
            <button type="button" aria-pressed="false">列表</button>
          </div>
          <button type="button" class="ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
            补查
          </button>
        </div>
      </header>

      <section class="shelf-section" aria-labelledby="shelf-now">
        <div class="shelf-label">
          <p id="shelf-now">正在读</p>
          <em>第 12 / 28 章</em>
        </div>
        <div class="shelf">
          <div class="shelf-inner">
            <div class="books">
              <div class="now">
                <button class="faceout" type="button" aria-label="继续阅读《我可是正道大师兄》，第 12 章，42%">
                  <span class="cover">
                    <span class="cv-rule"></span>
                    <span class="cv-seal" aria-hidden="true">我</span>
                    <span class="cv-title"><span>我可是正道</span><span>大师兄</span></span>
                    <svg class="cv-art" viewBox="0 0 150 86" preserveAspectRatio="none" aria-hidden="true">
                      <path d="M0 62 L26 40 L47 55 L72 27 L99 51 L122 36 L150 58 V86 H0Z" fill="#3E2E1E" opacity=".88"/>
                      <path d="M0 72 L33 55 L59 68 L91 47 L119 61 L150 50 V86 H0Z" fill="#241C15" opacity=".55"/>
                    </svg>
                    <span class="cv-author">本地 TXT · 连载</span>
                  </span>
                </button>
                <div class="now-card">
                  <p class="now-eyebrow"><i aria-hidden="true"></i>在读</p>
                  <p class="now-meta">第 12 / 28 章 · 42%<br>三天前读到「山门夜话」</p>
                  <div class="now-bar" aria-hidden="true"><span style="width:42%"></span></div>
                  <button class="now-cta" type="button">
                    继续阅读
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M14 6l6 6-6 6"/></svg>

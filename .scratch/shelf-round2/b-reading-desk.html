<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="dsh-design" content="desktop">
<title>方向 B · 阅读桌 · 墨读</title>
<style>
  :root{
    --linen:#E8E1D2;
    --paper:#FBF7EC;
    --ink:#1F2A24;
    --green:#283D33;
    --moss:#4F6B57;
    --brass:#B08A46;
    --oxblood:#7A3B2E;
    --serif:"Songti SC","Noto Serif CJK SC","Source Han Serif SC",serif;
    --sans:"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:var(--sans);color:var(--ink);background:var(--linen);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .app{display:grid;grid-template-columns:236px 1fr;height:100vh;min-height:720px}

  /* ── 侧栏 ── */
  .side{background:var(--green);color:#EFE8D8;display:flex;flex-direction:column;padding:54px 14px 20px;position:relative}
  .side::after{content:"";position:absolute;inset:0 0 0 auto;width:1px;background:rgba(255,255,255,.08)}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px;margin-bottom:34px}
  .brand-seal{width:30px;height:30px;flex:none;background:var(--brass);color:#221A10;display:grid;place-items:center;font:17px/1 var(--serif);border-radius:2px}
  .brand-name{font:21px/1.35 var(--serif);letter-spacing:.1em;width:64px;flex:none;padding:2px 0 3px}
  .brand-sub{font:11px/1 var(--sans);letter-spacing:.26em;color:rgba(239,232,216,.66);margin-top:3px}
  .nav{display:flex;flex-direction:column;gap:3px}
  .nav-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:3px;color:rgba(239,232,216,.76);font-size:13px;text-decoration:none;position:relative}
  .nav-item svg{width:16px;height:16px;flex:none;opacity:.85}
  .nav-item:hover{background:rgba(255,255,255,.05);color:#F6F0E2}
  .nav-item.on{background:rgba(255,255,255,.07);color:#F8F2E4}
  .nav-item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;background:var(--brass)}
  .nav-kbd{margin-left:auto;font-size:11px;letter-spacing:.04em;color:rgba(239,232,216,.72)}
  .side-foot{margin-top:auto;padding:18px 10px 0;border-top:1px solid rgba(255,255,255,.1)}
  .week-top{display:flex;justify-content:space-between;align-items:baseline}
  .week-label{font-size:11px;letter-spacing:.16em;color:rgba(239,232,216,.72)}
  .week-value{font:15px/1 var(--serif);letter-spacing:.04em;color:#F1E8D4}
  .week-bars{display:flex;gap:5px;margin:12px 0 10px}
  .week-bars i{height:3px;flex:1;background:rgba(255,255,255,.14);border-radius:1px}
  .week-bars i.on{background:var(--brass)}
  .week-note{font-size:11px;line-height:1.55;color:rgba(239,232,216,.72)}

  /* ── 主区 ── */
  .main{display:flex;flex-direction:column;min-width:0;background:var(--linen);position:relative}
  .main::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
    background:repeating-linear-gradient(0deg,rgba(31,42,36,.025) 0 1px,transparent 1px 3px),
               repeating-linear-gradient(90deg,rgba(255,255,255,.16) 0 1px,transparent 1px 4px)}
  .topbar{height:68px;flex:none;display:flex;align-items:center;gap:20px;padding:0 32px 0 36px;position:relative;z-index:2}
  .search{display:flex;align-items:center;gap:10px;width:270px;height:34px;padding:0 11px;background:rgba(251,247,236,.7);border:1px solid rgba(31,42,36,.16);border-radius:3px;color:rgba(31,42,36,.66)}
  .search svg{width:14px;height:14px;flex:none}
  .search span{font-size:12px}
  .search .kbd{margin-left:auto;font-size:11px;border:1px solid rgba(31,42,36,.16);border-radius:2px;padding:1px 4px;color:rgba(31,42,36,.66)}
  .status{margin-left:auto;display:flex;align-items:center;gap:15px;font-size:11px;color:rgba(31,42,36,.74)}
  .dot{width:5px;height:5px;border-radius:50%;background:var(--moss);display:inline-block;margin-right:6px;vertical-align:1px}

  .stage{flex:1;min-height:0;display:flex;flex-direction:column;padding:8px 40px 20px;position:relative;z-index:1}
  .head{flex:none;display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:0 4px 4px}
  .kicker{font-size:11px;letter-spacing:.18em;color:rgba(31,42,36,.72);margin-bottom:9px}
  h1{font:36px/1.1 var(--serif);font-weight:400;letter-spacing:.04em}
  .lede{font-size:13px;line-height:1.6;color:rgba(31,42,36,.74);margin-top:9px}
  .head-actions{display:flex;align-items:center;gap:10px;flex:none;padding-bottom:2px}
  .toggle{display:flex;border:1px solid rgba(31,42,36,.24);border-radius:3px;overflow:hidden;background:rgba(251,247,236,.55)}
  .toggle button{height:30px;padding:0 13px;font-size:12px;color:rgba(31,42,36,.72)}
  .toggle button+button{border-left:1px solid rgba(31,42,36,.18)}
  .toggle button.on{background:var(--ink);color:#F6EFDF}
  .ghost{display:flex;align-items:center;gap:6px;font-size:12px;color:rgba(31,42,36,.74);height:30px;padding:0 4px}
  .ghost svg{width:14px;height:14px}
  .ghost:hover{color:var(--ink)}

  /* ── 桌面 ── */
  .desk{flex:1;min-height:0;position:relative;display:flex;align-items:flex-end;gap:44px;padding:18px 6px 14px}
  .desk::before{content:"";position:absolute;left:-40px;right:-40px;top:-30px;bottom:0;pointer-events:none;
    background:radial-gradient(560px 300px at 36% 52%,rgba(255,250,235,.9),rgba(255,250,235,0) 72%)}
  .desk::after{content:"";position:absolute;left:-40px;right:-40px;bottom:0;height:22px;pointer-events:none;
    background:linear-gradient(rgba(31,42,36,0),rgba(31,42,36,.07))}
  .desk-line{position:absolute;left:-40px;right:-40px;bottom:0;height:1px;background:rgba(31,42,36,.16);z-index:3}

  /* 摊开的书 */
  .book-wrap{position:relative;flex:none;margin-left:12px}
  .open-book{position:relative;width:620px;height:400px;display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border-radius:3px 4px 4px 3px;
    box-shadow:0 1px 0 rgba(255,255,255,.8) inset,0 2px 0 #DCD2BC,0 22px 34px -18px rgba(45,35,20,.45),0 4px 10px rgba(45,35,20,.12)}
  .open-book::after{content:"";position:absolute;left:7px;right:7px;bottom:-7px;height:9px;border-radius:0 0 4px 4px;background:repeating-linear-gradient(0deg,#E4DAC4 0 1px,#F7F1E2 1px 2px);box-shadow:0 2px 4px rgba(45,35,20,.18)}
  .page{position:relative;padding:34px 36px 28px;overflow:hidden}
  .page.left{padding-left:40px}
  .page.right{background:linear-gradient(90deg,rgba(31,42,36,.07),rgba(31,42,36,0) 26%)}
  .gutter{position:absolute;top:0;bottom:0;left:50%;width:34px;transform:translateX(-50%);pointer-events:none;
    background:linear-gradient(90deg,rgba(31,42,36,0),rgba(31,42,36,.09) 44%,rgba(31,42,36,.14) 50%,rgba(31,42,36,.09) 56%,rgba(31,42,36,0))}
  .ribbon{position:absolute;left:50%;top:-14px;width:13px;height:52px;margin-left:-6px;background:var(--brass);z-index:4;
    clip-path:polygon(0 0,100% 0,100% 100%,50% 78%,0 100%);box-shadow:0 2px 3px rgba(0,0,0,.18)}
  .seal{width:34px;height:34px;display:grid;place-items:center;background:var(--oxblood);color:#F8EEDC;font:17px/1 var(--serif);border-radius:2px;margin-bottom:22px}
  .book-title{font:36px/1.42 var(--serif);font-weight:400;letter-spacing:.04em}
  .rule{width:38px;height:1px;background:rgba(31,42,36,.32);margin:20px 0 16px}
  .book-by{font-size:13px;letter-spacing:.06em;color:rgba(31,42,36,.66)}
  .book-meta{font-size:11px;letter-spacing:.06em;color:rgba(31,42,36,.72);margin-top:7px}
  .page-mark{position:absolute;left:40px;bottom:24px;font-size:11px;letter-spacing:.2em;color:rgba(31,42,36,.68)}

  .eyebrow{font-size:11px;letter-spacing:.16em;color:rgba(31,42,36,.62)}
  .pct{font:36px/1.2 var(--serif);margin:12px 0 16px;display:flex;align-items:baseline;gap:2px;padding-bottom:2px}
  .pct span{font-size:15px;color:rgba(31,42,36,.55)}
  .bar{height:3px;background:rgba(31,42,36,.12);border-radius:2px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--oxblood)}
  .last{font-size:13px;line-height:1.65;color:rgba(31,42,36,.7);margin:19px 0 0}
  .cta{display:flex;align-items:center;gap:8px;margin-top:22px;padding:6px 0 7px;font-size:13px;letter-spacing:.04em;border-bottom:1px solid rgba(31,42,36,.4);min-height:32px;align-self:flex-start}
  .cta span{transition:transform .18s ease}
  .cta:hover span{transform:translateX(4px)}
  .cta:focus-visible,.stack-book:focus-visible,.ghost:focus-visible,.toggle button:focus-visible,.nav-item:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
  .hint{font-size:11px;color:rgba(31,42,36,.54);margin-top:11px;letter-spacing:.03em}

  /* 手边一摞 */
  .stack-wrap{flex:none;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;padding-bottom:3px}
  .stack-label{display:flex;align-items:baseline;gap:8px;font-size:11px;letter-spacing:.16em;color:rgba(31,42,36,.74);margin-bottom:14px}
  .stack-label em{font-style:normal;font:15px/1 var(--serif);letter-spacing:.04em;color:rgba(31,42,36,.72)}
  .stack{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .stack-book{width:var(--w,286px);height:42px;flex:none;display:flex;align-items:center;gap:12px;padding:0 15px;border-radius:2px;
    color:var(--t,#F4EAD6);background:var(--c,#2F4A3A);position:relative;text-align:left;
    box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 2px 5px rgba(35,26,14,.22);
    transform:translateX(var(--x,0));transition:transform .18s ease}
  .stack-book:hover{transform:translateX(calc(var(--x,0px) - 7px))}
  .sb-title{font-size:13px;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sb-author{margin-left:auto;font-size:11px;white-space:nowrap}
  .stack-book.latin .sb-title{font-family:var(--sans);font-size:12px}
  .stack-book.pale{color:#25302A}
  .stack-book.pale .sb-author{opacity:.8}

  .foot{flex:none;display:flex;justify-content:space-between;align-items:center;padding:9px 4px 0;font-size:11px;letter-spacing:.04em;color:rgba(31,42,36,.74)}
  .foot span{color:rgba(31,42,36,.66)}

  @media (max-width:1100px){
    .open-book{width:540px;height:380px}
    .desk{gap:28px}
    .stack-book{width:240px}
  }
  @media (max-width:820px){
    .app{grid-template-columns:1fr}
    .side{display:none}
    body{overflow:auto}
    .stage{padding:0 20px 24px}
    .topbar{padding:0 20px}
    .search{width:200px}
    .desk{flex-direction:column;align-items:stretch;gap:26px;padding-top:10px}
    .book-wrap{margin:0}
    .open-book{width:100%;height:auto;grid-template-columns:1fr;box-shadow:0 14px 26px -16px rgba(45,35,20,.4)}
    .page.right{border-top:1px solid rgba(31,42,36,.1);background:none}
    .gutter,.ribbon{display:none}
    .stack-wrap{margin:0;align-items:stretch}
    .stack{align-items:stretch}
    .stack-book{width:100%}
    .head{align-items:flex-start;flex-direction:column;gap:14px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">
      <span class="brand-seal">墨</span>
      <div>
        <div class="brand-name">墨读</div>
        <div class="brand-sub">MO READ</div>
      </div>
    </div>
    <nav class="nav" aria-label="主导航">
      <a class="nav-item on" href="#" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 5.5h6.2c1 0 1.8.8 1.8 1.8V19c0-.9-.8-1.6-1.8-1.6H4z"/><path d="M20 5.5h-6.2c-1 0-1.8.8-1.8 1.8V19c0-.9.8-1.6 1.8-1.6H20z"/></svg>
        书架 <span class="nav-kbd">⌘1</span>
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="11" cy="11" r="6.2"/><path d="M15.8 15.8 20 20"/></svg>
        发现 <span class="nav-kbd">⌘2</span>
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M10 13.6a3.6 3.6 0 0 0 5.1 0l2.1-2.1a3.6 3.6 0 0 0-5.1-5.1l-1.2 1.2"/><path d="M14 10.4a3.6 3.6 0 0 0-5.1 0l-2.1 2.1a3.6 3.6 0 0 0 5.1 5.1l1.2-1.2"/></svg>
        书源 <span class="nav-kbd">⌘3</span>
      </a>
      <a class="nav-item" href="#">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.1"/><circle cx="9" cy="17" r="2.1"/></svg>
        设置 <span class="nav-kbd">⌘4</span>
      </a>
    </nav>
    <div class="side-foot">
      <div class="week-top"><span class="week-label">本周</span><span class="week-value">3 时 42 分</span></div>
      <div class="week-bars" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i><i></i></div>
      <p class="week-note">昨天读得最久 ·《月亮与六便士》</p>
    </div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="search" role="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4 4"/></svg>
        <span>搜书名、作者</span><span class="kbd">⌘K</span>
      </div>
      <div class="status"><span><i class="dot"></i>离线可用</span><span>十一月六日 · 周五</span></div>
    </div>

    <div class="stage">
      <header class="head">
        <div>
          <p class="kicker">本机书库 · 八本</p>
          <h1>书架</h1>
          <p class="lede">摊开在读的一本，其余码在手边。</p>
        </div>
        <div class="head-actions">
          <div class="toggle" role="group" aria-label="布局">
            <button class="on">书架</button><button>列表</button>
          </div>
          <button class="ghost">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 11a8 8 0 1 0-2.3 5.6"/><path d="M20 4v6h-6"/></svg>
            补查
          </button>
        </div>
      </header>

      <div class="desk">
        <div class="book-wrap">
          <div class="ribbon" aria-hidden="true"></div>
          <div class="open-book">
            <div class="page left">
              <div class="seal" aria-hidden="true">我</div>
              <h2 class="book-title">我可是正道<br>大师兄</h2>
              <div class="rule" aria-hidden="true"></div>
              <p class="book-by">连载 · 本地 TXT</p>
              <p class="book-meta">第 12 / 28 章 · 42%</p>
              <p class="page-mark">MO READ</p>
            </div>
            <div class="page right">
              <p class="eyebrow">在读 · 上次停在这里</p>
              <p class="pct">42<span>%</span></p>
              <div class="bar" aria-hidden="true"><i style="width:42%"></i></div>
              <p class="last">三天前读到「山门夜话」<br>第 12 章 · 还剩 16 章</p>
              <button class="cta">继续阅读 <span aria-hidden="true">→</span></button>
              <p class="hint">⌘↵ 从上次位置继续</p>
            </div>
            <div class="gutter" aria-hidden="true"></div>
          </div>
        </div>

        <div class="stack-wrap">
          <p class="stack-label">手边 <em>七本</em></p>
          <div class="stack">
            <button class="stack-book" style="--c:#24344D;--t:#F1E7D2;--w:296px;--x:10px" aria-label="月亮与六便士，毛姆">
              <span class="sb-title">月亮与六便士</span><span class="sb-author">毛姆</span>
            </button>
            <button class="stack-book" style="--c:#A4552F;--t:#FFF3E0;--w:278px;--x:0px" aria-label="人类简史，赫拉利">
              <span class="sb-title">人类简史</span><span class="sb-author">赫拉利</span>
            </button>
            <button class="stack-book" style="--c:#6B2B22;--t:#F3E1C8;--w:292px;--x:14px" aria-label="百年孤独，马尔克斯">
              <span class="sb-title">百年孤独</span><span class="sb-author">马尔克斯</span>
            </button>
            <button class="stack-book pale" style="--c:#C9D6DC;--w:266px;--x:3px" aria-label="局外人，加缪">
              <span class="sb-title">局外人</span><span class="sb-author">加缪</span>
            </button>
            <button class="stack-book pale latin" style="--c:#E8D9B8;--w:288px;--x:8px" aria-label="The Little Prince，Saint-Exupéry">
              <span class="sb-title">The Little Prince</span><span class="sb-author">Saint-Ex.</span>
            </button>
            <button class="stack-book" style="--c:#2F4A3A;--t:#EFE3CC;--w:274px;--x:0px" aria-label="mr-two-chapters，本地 TXT">
              <span class="sb-title">mr-two-chapters</span><span class="sb-author">本地</span>
            </button>
            <button class="stack-book" style="--c:#4A3B52;--t:#EDE4EE;--w:284px;--x:11px" aria-label="curl-test，本地 TXT">
              <span class="sb-title">curl-test</span><span class="sb-author">本地</span>
            </button>
          </div>
        </div>
        <div class="desk-line" aria-hidden="true"></div>
      </div>

      <footer class="foot">
        <p>共 8 本 · 本机保存 · 不上传</p>
        <p>上次补查 2 小时前</p>
      </footer>
    </div>
  </main>
</div>
</body>
</html>
